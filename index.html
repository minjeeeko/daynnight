<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>낮과밤 — 오프라인 만남 보장 매칭</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- 데스크톱 사이드 내비게이션 -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand__logo" aria-hidden="true">
          <svg viewBox="0 0 40 40" width="36" height="36">
            <defs>
              <linearGradient id="dn" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ff8a3d"/>
                <stop offset="1" stop-color="#ff6600"/>
              </linearGradient>
            </defs>
            <circle cx="20" cy="20" r="18" fill="url(#dn)"/>
            <path d="M27 24.5A9 9 0 0 1 16.2 12a9 9 0 1 0 10.8 12.5Z" fill="#fff"/>
          </svg>
        </span>
        <span class="brand__name">낮과밤</span>
      </div>
      <nav class="nav" id="sideNav"></nav>
      <div class="sidebar__foot">
        <div class="mini-profile" id="miniProfile"></div>
      </div>
    </aside>

    <!-- 메인 영역 -->
    <main class="main">
      <header class="appbar" id="appbar">
        <button class="appbar__back" id="appbarBack" aria-label="뒤로" hidden>
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <h1 class="appbar__title" id="appbarTitle">탐색</h1>
        <div class="appbar__actions" id="appbarActions"></div>
      </header>

      <section class="screen" id="screen"></section>
    </main>

    <!-- 모바일 하단 탭바 -->
    <nav class="tabbar" id="tabbar"></nav>
  </div>

  <!-- 토스트 -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
